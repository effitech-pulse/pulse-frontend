# Access logs contain static location groups only. duration_s is seconds.
# Native error logs can include URI/upstream details: disable them in O1.
# Nginx launcher/configuration failures before this config loads remain native diagnostics.
log_format pulse_json escape=json '{"timestamp":"$time_iso8601","severity_text":"INFO","event_name":"http.completed","service.name":"pulse-frontend","service.version":"unknown","service.instance.id":"nginx-$pid","deployment.environment.name":"local","http_request_id":"$request_id","http.route":"$pulse_route","http.response.status_code":$status,"duration_s":$request_time}';

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 64m;
  access_log /dev/stdout pulse_json;
  error_log /dev/null crit;
  set $pulse_route "spa";
  add_header X-Request-ID $request_id always;
  proxy_set_header X-Request-ID $request_id;
  proxy_hide_header X-Request-ID;
  location /api/ {
    set $pulse_route "/api/*";
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 10s;
    proxy_read_timeout 360s;
  }
  location = /health { set $pulse_route "/health"; proxy_pass http://backend:8000; }
  location = /openapi.json { set $pulse_route "/openapi.json"; proxy_pass http://backend:8000; }
  # The SPA entry point must revalidate across releases; asset URLs are hashed.
  location = /index.html {
    add_header X-Request-ID $request_id always;
    add_header Cache-Control "no-store" always;
  }
  location / { try_files $uri $uri/ /index.html; }
}
